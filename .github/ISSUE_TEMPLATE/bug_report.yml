name: Bug report
description: Something in Daybook does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not paste private journal entries. Describe them or use made-up text instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a journal
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS, Safari on iPhone 15, ...
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors or screenshots (optional)
