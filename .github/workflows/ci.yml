name: CI

on:
  push:
    branches: [main, release-checkpoint]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Build matches the committed index.html and is reproducible
        run: |
          python3 build.py
          git diff --exit-code index.html
          sha256sum index.html > /tmp/first.sha
          python3 build.py
          sha256sum -c /tmp/first.sha

      - name: Browser tests (software WebGL in headless Chrome)
        env:
          CHROME: /usr/bin/google-chrome
        run: npm test
